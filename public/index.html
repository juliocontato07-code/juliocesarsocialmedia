<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover libera a área sob o notch; o CSS devolve o respiro
       com env(safe-area-inset-*) onde ele faz falta -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0B" />
  <meta name="color-scheme" content="dark" />

  <!-- atalho na tela inicial -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icones/icone-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Social Media" />

  <title>Júlio César - Social Media</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topo">
    <div class="topo-marca">
      <span class="topo-traco"></span>
      <h1>Júlio César - Social Media</h1>
    </div>
    <nav class="topo-nav" id="nav">
      <button class="aba" data-tela="dia">Dia</button>
      <button class="aba" data-tela="semanal">Semanal</button>
      <button class="aba" data-tela="mensal">Mensal</button>
      <button class="aba" data-tela="lista">Lista</button>
      <button class="aba" data-tela="dashboard">Dashboard</button>
      <button class="aba" data-tela="rotinas">Rotinas</button>
      <button class="aba" data-tela="clientes">Clientes</button>
      <button class="aba aba-admin" data-tela="usuarios">Usuários</button>
      <span class="topo-divisor"></span>
      <span class="acoes-topo" id="acoes-topo"></span>
      <span class="menu-caixa" id="menu-app"></span>
    </nav>
  </header>

  <main class="conteudo" id="conteudo"></main>

  <!-- Barra de navegação do celular. Fica no HTML, e não montada por
       JavaScript, para existir antes do primeiro desenho: uma barra que
       aparece depois empurraria o conteúdo já renderizado. O CSS a esconde
       acima de 768px. -->
  <nav class="barra-inferior" id="barra-inferior" aria-label="Navegação principal"></nav>

  <script src="/js/dispositivo.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/estado.js"></script>
  <script src="/js/datas.js"></script>
  <script src="/js/arrastar.js"></script>
  <script src="/js/campos.js"></script>
  <script src="/js/cartao.js"></script>
  <script src="/js/filtro.js"></script>
  <script src="/js/tela-dia.js"></script>
  <script src="/js/tela-semanal.js"></script>
  <script src="/js/tela-mensal.js"></script>
  <script src="/js/tela-lista.js"></script>
  <script src="/js/tela-dashboard.js"></script>
  <script src="/js/tela-rotinas.js"></script>
  <script src="/js/exportacao.js"></script>
  <script src="/js/tela-clientes.js"></script>
  <script src="/js/tela-tags.js"></script>
  <script src="/js/tela-usuarios.js"></script>
  <script src="/js/tela-planejador.js"></script>
  <script src="/js/tela-demanda.js"></script>
  <script src="/js/importar.js"></script>
  <script src="/js/exportar-conteudos.js"></script>
  <script src="/js/menu.js"></script>
  <script src="/js/navegacao-mobile.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
